services:
  db:
    image: postgres:18-alpine
    container_name: agrocore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrocore}
      POSTGRES_USER: ${POSTGRES_USER:-agrocore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrocore}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Los scripts de init solo corren la primera vez (volumen vacío).
      # Para recrear la base desde cero: docker compose down -v && docker compose up -d
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Datos ya scrapeados, para la carga inicial (03_carga_inicial.sql)
      - ./data:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
