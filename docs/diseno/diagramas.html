<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { --bg:#f6f7f4; --panel:#ffffff; --ink:#1d2a24; --muted:#5d6b63; --line:#d9ded8; --accent:#2f6b4f; --accent-soft:#e6f0ea; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .layout { display:grid; grid-template-columns: 290px minmax(0,1fr); min-height:100vh; }
  nav { background:var(--panel); border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; overflow:auto; }
  nav h1 { font-size:16px; margin:0 8px 2px; }
  nav p { margin:0 8px 14px; color:var(--muted); font-size:12.5px; }
  nav button { display:block; width:100%; text-align:left; border:0; background:none; padding:7px 8px; border-radius:6px; cursor:pointer; font:inherit; font-size:13.5px; color:var(--ink); }
  nav button:hover { background:var(--accent-soft); }
  nav button.on { background:var(--accent); color:#fff; }
  nav button b { font-weight:600; margin-right:6px; }
  main { padding:26px 30px 60px; min-width:0; }
  h2 { margin:0 0 4px; font-size:22px; }
  .meta { color:var(--muted); margin:0 0 18px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin:0 0 18px; }
  section h3 { margin:0 0 10px; font-size:16px; color:var(--accent); }
  section ul { margin:0; padding-left:20px; }
  .diagram { overflow:auto; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; }
  .diagram svg { max-width:none !important; height:auto; }
  .diagram.fit svg { width:100% !important; max-width:100% !important; }
  .tools { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .tools button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; font-size:13px; }
  .tools button:hover { border-color:var(--accent); color:var(--accent); }
  details { margin-top:10px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; }
  pre { background:#f1f3ef; border-radius:8px; padding:12px; overflow:auto; font:12.5px/1.45 Consolas, monospace; }
  .err { color:#a12626; white-space:pre-wrap; font:12.5px Consolas, monospace; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } nav { position:static; height:auto; } main { padding:16px; } }
  @media print { nav, .tools, details { display:none; } .layout { display:block; } section { break-inside:avoid; } }
</style>

<script>
// CUU01 a CUU07 – Acceso, suscripciones y campañas
window.CU.push({
  id: 'CUU01', nombre: 'Iniciar sesión', controlador: 'ControladorIniciarSesion',
  supuestos: [
    'La credencial obligatoria faltante (2.a) la valida la UI antes de enviar el evento.',
    'El controlador deja disponible para la vista el objeto usuarioLogueado (model de Spring MVC); la UI le pide las prestaciones para mostrarlas.',
    'El envío del correo de restablecimiento (2.c.2) se delega a un servicio de infraestructura que no se modela.'
  ],
  dsd: [
    { titulo: 'Evento 1 – iniciarSesion', code: `
sequenceDiagram
participant UI as :UI
participant C as c:ControladorIniciarSesion
participant UD as uDao:«Repository» UsuarioDao
participant U as u:Usuario
participant S as suscripcionActual:Suscripcion
participant P as plan:Plan
Note over UI: UI recibe del actor: email + password
UI->>+C: iniciarSesion(email : String, password : String)
C->>+UD: buscarPorEmail(email : String)
Note right of UD: JPQL: SELECT u FROM Usuario u WHERE u.email = ?1
UD-->>-C: «u : Usuario»
Note over C: respuesta = "No se puede autenticar al usuario"
opt u IS NOT NULL
  C->>+U: validarAcceso(password : String)
  Note right of U: accesoValido = (this.password == password) AND (estado == "habilitada")
  U-->>-C: «accesoValido : Boolean»
  alt accesoValido == true
    C->>+U: tieneSuscripcionVigente()
    U->>+S: estaVigente()
    Note right of S: vigente = (estado == "activa") AND (fechaFin >= date())
    S-->>-U: «vigente : Boolean»
    U-->>-C: «vigente : Boolean»
    alt vigente == true
      Note over C: usuarioLogueado = u. respuesta = "Sesión iniciada"
    else vigente == false
      Note over C: respuesta = "Suscripción vencida o cancelada: puede contratar o cambiar de plan"
    end
  else accesoValido == false
    C->>+U: getEstado()
    U-->>-C: «estado : String»
    Note over C: respuesta = "Credenciales inválidas" o "Cuenta inhabilitada: canales de asistencia", según estado
  end
end
C-->>-UI: «respuesta : String»
opt respuesta == "Sesión iniciada"
  UI->>+U: getPrestacionesHabilitadas()
  U->>+S: getPrestaciones()
  S->>+P: getPrestaciones()
  P-->>-S: «prestaciones : String[*]»
  S-->>-U: «prestaciones : String[*]»
  U-->>-UI: «prestaciones : String[*]»
end
Note over UI: UI muestra al actor: respuesta + prestaciones
` },
    { titulo: 'Evento 2 – solicitarRestablecimiento (alternativa 2.c)', code: `
sequenceDiagram
participant UI as :UI
participant C as c:ControladorIniciarSesion
participant UD as uDao:«Repository» UsuarioDao
participant U as u:Usuario
Note over UI: UI recibe del actor: email
UI->>+C: solicitarRestablecimiento(email : String)
C->>+UD: buscarPorEmail(email : String)
UD-->>-C: «u : Usuario»
opt u IS NOT NULL
  C->>+U: generarTokenRestablecimiento()
  Note right of U: tokenRestablecimiento = nuevo token, vencimientoToken = date() + 1 día
  U-->>-C: «token : String»
  C->>+UD: save(u : Usuario)
  UD-->>-C:
end
C-->>-UI: «token : String»
Note over UI: UI muestra al actor: "Se enviaron las instrucciones al correo informado"
` },
    { titulo: 'Evento 3 – establecerNuevaPassword (alternativa 2.c)', code: `
sequenceDiagram
participant UI as :UI
participant C as c:ControladorIniciarSesion
participant UD as uDao:«Repository» UsuarioDao
participant U as u:Usuario
Note over UI: UI recibe del actor: token + nuevaPassword
UI->>+C: establecerNuevaPassword(token : String, nuevaPassword : String)
C->>+UD: buscarPorToken(token : String)
Note right of UD: JPQL: SELECT u FROM Usuario u WHERE u.tokenRestablecimiento = ?1
UD-->>-C: «u : Usuario»
Note over C: cambiada = false
opt u IS NOT NULL
  C->>+U: cambiarPassword(token : String, nuevaPassword : String)
  Note right of U: Si vencimientoToken >= date(): password = nuevaPassword, tokenRestablecimiento = NULL
  U-->>-C: «cambiada : Boolean»
  opt cambiada == true
    C->>+UD: save(u : Usuario)
    UD-->>-C:
  end
end
C-->>-UI: «cambiada : Boolean»
Note over UI: UI muestra al actor: resultado y reinicia la autenticación (Evento 1)
` }
  ],
  dcd: `
classDiagram
class ControladorIniciarSesion {
  +iniciarSesion(email : String, password : String) String
  +solicitarRestablecimiento(email : String) String
  +establecerNuevaPassword(token : String, nuevaPassword : String) Boolean
}
class UsuarioDao {
  <<Repository>>
  +buscarPorEmail(email : String) Usuario
  +buscarPorToken(token : String) Usuario
  +save(u : Usuario)
}
class Usuario {
  -idUsuario : Integer = {@Id @GeneratedValue}
  -email : String
  -password : String
  -estado : String
  -tokenRestablecimiento : String
  -vencimientoToken : Date
  +validarAcceso(password : String) Boolean
  +getEstado() String
  +tieneSuscripcionVigente() Boolean
  +getPrestacionesHabilitadas() String[*]
  +generarTokenRestablecimiento() String
  +cambiarPassword(token : String, nuevaPassword : String) Boolean
}
class Suscripcion {
  -estado : String
  -fechaFin : Date
  +estaVigente() Boolean
  +getPrestaciones() String[*]
}
class Plan {
  -prestaciones : String[*]
  +getPrestaciones() String[*]
}
ControladorIniciarSesion "*" --> "0..1 -uDao" UsuarioDao
ControladorIniciarSesion "*" --> "0..1 -usuarioLogueado" Usuario
UsuarioDao ..> Usuario
Usuario "1" *--> "0..1 -suscripcionActual" Suscripcion
Suscripcion "*" --> "1 -plan" Plan
`
});

window.CU.push({
  id: 'CUU02', nombre: 'Registrarse', controlador: 'ControladorRegistrarse',
  supuestos: [
    'La pasarela de pagos es un sistema externo: se accede mediante la interfaz «Service» PasarelaPago, que devuelve un ResultadoPago (estado: confirmado, rechazado o pendiente).',
    'Si la pasarela no confirma (4.b), la cuenta y la suscripción se guardan en estado "pendiente" para conciliar luego esa misma operación; no se genera otro cobro.',
    'El contador de usuarios activos por plan se obtiene por consulta (no se almacena como atributo).'
  ],
  dsd: [
    { titulo: 'Evento 1 – ingresarDatosRegistro', code: `
sequenceDiagram
participant UI as :UI
participant C as c:ControladorRegistrarse
participant UD as uDao:«Repository» UsuarioDao
participant PD as pDao:«Repository» PlanDao
Note over UI: UI recibe del actor: nombre + email + password + aceptación de condiciones
UI->>+C: ingresarDatosRegistro(nombre : String, email : String, password : String)
C->>+UD: buscarPorEmail(email : String)
Note right of UD: JPQL: SELECT u FROM Usuario u WHERE u.email = ?1
UD-->>-C: «existente : Usuario»
opt existente IS NULL
  create participant NU as nuevoUsuario:Usuario
  C-->>NU: create(nombre : String, email : String, password : String)
  Note right of NU: estado = "pendiente", fechaAceptacion = date()
  C->>+PD: findAll()
  PD-->>-C: «planes : Plan[*]»
end
C-->>-UI: «planes : Plan[*]»
participant PL as planes[i]:Plan
alt planes IS NOT NULL
  loop Para cada p en planes
    UI->>+PL: getIdPlan()
    PL-->>-UI: «idPlan : Integer»
    UI->>+PL: getNombre()
    PL-->>-UI: «nombre : String»
    UI->>+PL: getPrecio()
    PL-->>-UI: «precio : Real»
  end
  Note over UI: UI muestra al actor: idPlan + nombre + precio de cada plan
else planes IS NULL
  Note over UI: UI muestra al actor: "Ya existe una cuenta equivalente"
end
` },
    { titulo: 'Evento 2 – seleccionarPlan', code: `
sequenceDiagram
participant UI as :UI
participant C as c:ControladorRegistrarse
participant PD as pDao:«Repository» PlanDao
participant PS as planSeleccionado:Plan
Note over UI: UI recibe del actor: idPlan
UI->>+C: seleccionarPlan(idPlan : Integer)
C->>+PD: getOne(idPlan : Integer)
PD-->>-C: «planSeleccionado : Plan»
C-->>-UI: «planSeleccionado : Plan»
UI->>+PS: getPrecio()
PS-->>-UI: «precio : Real»
Note over UI: UI muestra al actor: precio a pagar
` },
    { titulo: 'Evento 3 – autorizarPago', code: `
sequenceDiagram
participant UI as :UI
participant C as c:ControladorRegistrarse
participant PS as planSeleccionado:Plan
participant PP as pasarela:«Service» PasarelaPago
participant RP as res:ResultadoPago
participant NU as nuevoUsuario:Usuario
Note over UI: UI recibe del actor: datosMedioPago
UI->>+C: autorizarPago(datosMedioPago : String)
C->>+PS: getPrecio()
PS-->>-C: «precio : Real»
C->>+PP: solicitarPago(precio : Real, datosMedioPago : String)
PP-->>-C: «res : ResultadoPago»
C->>+RP: getEstado()
RP-->>-C: «estadoPago : String»
alt estadoPago == "rechazado"
  Note over C: respuesta = "Pago rechazado: puede autorizar otro medio de pago"
else estadoPago != "rechazado"
  C->>+NU: suscribir(planSeleccionado : Plan, res : ResultadoPago)
  create participant S as s:Suscripcion
  NU-->>S: create(planSeleccionado : Plan, res : ResultadoPago)
  Note right of S: estado = "activa" si el pago está confirmado, "pendiente" si no hubo confirmación
  create participant PGS as «multiobjeto» pagos:Pago
  S-->>PGS: create()
  create participant PG as pg:Pago
  S-->>PG: create(precio : Real, res : ResultadoPago)
  S->>+PGS: add(pg : Pago)
  PGS-->>-S:
  Note right of NU: suscripcionActual = s, estado = "habilitada" si s está activa
  NU-->>-C:
  participant UD as uDao:«Repository» UsuarioDao
  C->>+UD: save(nuevoUsuario : Usuario)
  UD-->>-C:
  Note over C: respuesta = "Cuenta habilitada" u "Operación pendiente de confirmación"
end
C-->>-UI: «respuesta : String»
Note over UI: UI muestra al actor: respuesta
` }
  ],
  dcd: `
classDiagram
class ControladorRegistrarse {
  +ingresarDatosRegistro(nombre : String, email : String, password : String) Plan[*]
  +seleccionarPlan(idPlan : Integer) Plan
  +autorizarPago(datosMedioPago : String) String
}
class UsuarioDao {
  <<Repository>>
  +buscarPorEmail(email : String) Usuario
  +save(u : Usuario)
}
class PlanDao {
  <<Repository>>
  +findAll() Plan[*]
  +getOne(idPlan : Integer) Plan
}
class PasarelaPago {
  <<Service>>
  +solicitarPago(monto : Real, datosMedioPago : String) ResultadoPago
}
class ResultadoPago {
  -estado : String
  -referencia : String
  +getEstado() String
}
class Usuario {
  -idUsuario : Integer = {@Id @GeneratedValue}
  -nombre : String
  -email : String
  -password : String
  -estado : String
  -fechaAceptacion : Date
  +create(nombre : String, email : String, password : String)
  +suscribir(p : Plan, res : ResultadoPago)
}
class Suscripcion {
  -estado : String
  -fechaInicio : Date
  +create(p : Plan, res : ResultadoPago)
}
class Pago {
  -monto : Real
  -fecha : Date
  -estado : String
  -referencia : String
  +create(monto : Real, res : ResultadoPago)
}
class Plan {
  -idPlan : Integer = {@Id @GeneratedValue}
  -nombre : String
  -precio : Real
  +getIdPlan() Integer
  +getNombre() String
  +getPrecio() Real
}
ControladorRegistrarse "*" --> "0..1 -uDao" UsuarioDao
ControladorRegistrarse "*" --> "0..1 -pDao" PlanDao
ControladorRegistrarse "*" --> "0..1 -pasarela" PasarelaPago
ControladorRegistrarse "1" --> "0..1 -nuevoUsuario" Usuario
ControladorRegistrarse "*" --> "0..1 -planSeleccionado" Plan
ControladorRegistrarse ..> ResultadoPago
PasarelaPago ..> ResultadoPago
UsuarioDao ..> Usuario
PlanDao ..> Plan
Usuario ..> ResultadoPago
Usuario "1" *--> "0..1 -suscripcionActual" Suscripcion
Suscripcion "*" --> "1 -plan" Plan
Suscripcion "1" *--> "1..* -pagos" Pago
`
});

window.CU.push({
  id: 'CUU03', nombre: 'Cambiar de plan', controlador: 'ControladorCambiarPlan',
  supuestos: [
    'El usuario está autenticado: el controlador lo conoce por el rol usuarioLogueado.',
    'El efecto económico (ajuste) lo calcula la Suscripcion comparando el precio del plan actual con el nuevo. Si el ajuste es 0 o negativo no se solicita pago.',
    'ajuste y nuevoPlan se guardan como variables de instancia del controlador porque se usan en el evento siguiente.'
  ],
  dsd: [
    { titulo: 'Evento 1 – consultarPlanes', code: `
sequenceDiagram
participant UI as :UI
participant C as c:ControladorCambiarPlan
participant PD as pDao:«Repository» PlanDao
participant PL as planes[i]:Plan
Note over UI: UI recibe del actor: ""
UI->>+C: consultarPlanes()
C->>+PD: findAll()
PD-->>-C: «planes : Plan[*]»
C-->>-UI: «planes : Plan[*]»
loop Para cada p en planes
  UI->>+PL: getIdPlan()
  PL-->>-UI: «idPlan : Integer»
  UI->>+PL: getNombre()
  PL-->>-UI: «nombre : String»
  UI->>+PL: getPrestaciones()
  PL-->>-UI: «prestaciones : String[*]»
  UI->>+PL: getPrecio()
  PL-->>-UI: «precio : Real»
end
Note over UI: UI muestra al actor: idPlan + nombre + prestaciones + precio de cada plan
` },
    { titulo: 'Evento 2 – seleccionarPlan', code: `
sequenceDiagram
participant UI as :UI
participant C as c:ControladorCambiarPlan
participant PD as pDao:«Repository» PlanDao
participant U as usuarioLogueado:Usuario
participant S as suscripcionActual:Suscripcion
participant PA as plan:Plan
participant NP as nuevoPlan:Plan
Note over UI: UI recibe del actor: idPlan
UI->>+C: seleccionarPlan(idPlan : Integer)
C->>+PD: getOne(idPlan : Integer)
PD-->>-C: «nuevoPlan : Plan»
C->>+U: calcularAjusteCambio(nuevoPlan : Plan)
U->>+S: calcularAjuste(nuevoPlan : Plan)
alt nuevoPlan != plan
  S->>+PA: getPrecio()
  PA-->>-S: «precioActual : Real»
  S->>+NP: getPrecio()
  NP-->>-S: «precioNuevo : Real»
  Note right of S: ajuste = precioNuevo - precioActual
else nuevoPlan == plan
  Note right of S: ajuste = NULL (la suscripción no requiere cambios)
end
S-->>-U: «ajuste : Real»
U-->>-C: «ajuste : Real»
C-->>-UI: «ajuste : Real»
Note over UI: UI muestra al actor: ajuste a pagar, o "Ya posee ese plan" si ajuste IS NULL
` },
    { titulo: 'Evento 3 – confirmarCambio', code: `
sequenceDiagram
participant UI as :UI
participant C as c:ControladorCambiarPlan
participant PP as pasarela:«Service» PasarelaPago
participant RP as res:ResultadoPago
participant U as usuarioLogueado:Usuario
participant S as suscripcionActual:Suscripcion
participant PGS as «multiobjeto» pagos:Pago
participant UD as uDao:«Repository» UsuarioDao
Note over UI: UI recibe del actor: datosMedioPago
UI->>+C: confirmarCambio(datosMedioPago : String)
Note over C: estadoPago = "sin cargo"
opt ajuste > 0
  C->>+PP: solicitarPago(ajuste : Real, datosMedioPago : String)
  PP-->>-C: «res : ResultadoPago»
  C->>+RP: getEstado()
  RP-->>-C: «estadoPago : String»
end
alt estadoPago == "rechazado"
  Note over C: respuesta = "Pago rechazado: se conserva el plan vigente"
else estadoPago == "pendiente"
  C->>+U: registrarCambioPendiente(nuevoPlan : Plan)
  U->>+S: registrarCambioPendiente(nuevoPlan : Plan)
  Note right of S: planPendiente = nuevoPlan (el plan vigente no cambia)
  S-->>-U:
  U-->>-C:
  C->>+UD: save(usuarioLogueado : Usuario)
  UD-->>-C:
  Note over C: respuesta = "Cambio pendiente de conciliación"
else estadoPago == "confirmado" OR estadoPago == "sin cargo"
  C->>+U: cambiarPlan(nuevoPlan : Plan, ajuste : Real)
  U->>+S: cambiarPlan(nuevoPlan : Plan, ajuste : Real)
  Note right of S: plan = nuevoPlan, fechaCambio = date()
  opt ajuste > 0
    create participant PG as pg:Pago
    S-->>PG: create(ajuste : Real)
    S->>+PGS: add(pg : Pago)
    PGS-->>-S:
  end
  S-->>-U:
  U-->>-C:
  C->>+UD: save(usuarioLogueado : Usuario)
  UD-->>-C:
  Note over C: respuesta = "Plan actualizado"
end
C-->>-UI: «respuesta : String»
Note over UI: UI muestra al actor: respuesta + nuevo plan y prestaciones habilitadas
` }
  ],
  dcd: `
classDiagram
class ControladorCambiarPlan {
  -ajuste : Real
  +consultarPlanes() Plan[*]
  +seleccionarPlan(idPlan : Integer) Real
  +confirmarCambio(datosMedioPago : String) String
}
class PlanDao {
  <<Repository>>
  +findAll() Plan[*]
  +getOne(idPlan : Integer) Plan
}
class UsuarioDao {
  <<Repository>>
  +save(u : Usuario)
}
class PasarelaPago {
  <<Service>>
  +solicitarPago(monto : Real, datosMedioPago : String) ResultadoPago
}
class ResultadoPago {
  -estado : String
  +getEstado() String
}
class Usuario {
  -idUsuario : Integer = {@Id @GeneratedValue}
  +calcularAjusteCambio(nuevoPlan : Plan) Real
  +cambiarPlan(nuevoPlan : Plan, ajuste : Real)
  +registrarCambioPendiente(nuevoPlan : Plan)
}
class Suscripcion {
  -fechaCambio : Date
  +calcularAjuste(nuevoPlan : Plan) Real
  +cambiarPlan(nuevoPlan : Plan, ajuste : Real)
  +registrarCambioPendiente(nuevoPlan : Plan)
}
class Pago {
  -monto : Real
  -fecha : Date
  +create(monto : Real)
}
class Plan {
  -idPlan : Integer = {@Id @GeneratedValue}
  -nombre : String
  -precio : Real
  -prestaciones : String[*]
  +getIdPlan() Integer
  +getNombre() String
  +getPrestaciones() String[*]
  +getPrecio() Real
}
ControladorCambiarPlan "*" --> "0..1 -pDao" PlanDao
ControladorCambiarPlan "*" --> "0..1 -uDao" UsuarioDao
ControladorCambiarPlan "*" --> "0..1 -pasarela" PasarelaPago
ControladorCambiarPlan "*" --> "0..1 -usuarioLogueado" Usuario
ControladorCambiarPlan "*" --> "0..1 -nuevoPlan" Plan
ControladorCambiarPlan ..> ResultadoPago
PasarelaPago ..> ResultadoPago
PlanDao ..> Plan
UsuarioDao ..> Usuario
Usuario ..> Plan
Usuario "1" *--> "0..1 -suscripcionActual" Suscripcion
Suscripcion "*" --> "1 -plan" Plan
Suscripcion "*" --> "0..1 -planPendiente" Plan
Suscripcion "1" *--> "1..* -pagos" Pago
`
});

window.CU.push({

<script>
// Une los DCD de todos los casos de uso en un único diagrama de clases
window.unificar = function () {
  const clases = new Map();     // nombre -> { estereotipo, atributos: Map, metodos: Map }
  const relaciones = new Map(); // clave -> { a, ma, tipo, mb, b }
  const clase = n => {
    if (!clases.has(n)) clases.set(n, { estereotipo: '', atributos: new Map(), metodos: new Map() });
    return clases.get(n);
  };
  const rol = m => (m.match(/-\w+/) || [''])[0];

  window.CU.forEach(cu => {
    let actual = null;
    cu.dcd.split('\n').forEach(raw => {
      const l = raw.trim();
      let m;
      if (actual) {
        if (l === '}') { actual = null; return; }
        if ((m = l.match(/^<<(\w+)>>$/))) { actual.estereotipo = m[1]; return; }
        if ((m = l.match(/^[+\-#](\w+)\((.*)\)/))) {
          // Mismo método = mismo nombre y mismos tipos de parámetros
          const tipos = m[2].split(',').map(p => (p.split(':')[1] || '').trim()).join(',');
          const k = m[1] + '(' + tipos + ')';
          if (!actual.metodos.has(k)) actual.metodos.set(k, l);
        } else if ((m = l.match(/^[+\-#](\w+)\s*:/))) {
          if (!actual.atributos.has(m[1])) actual.atributos.set(m[1], l);
        }
        return;
      }
      if ((m = l.match(/^class (\w+) \{$/))) { actual = clase(m[1]); return; }
      if ((m = l.match(/^class (\w+)$/))) { clase(m[1]); return; }
      if ((m = l.match(/^(\w+) (?:"([^"]*)" )?(\*-->|-->|\.\.>) (?:"([^"]*)" )?(\w+)$/))) {
        const r = { a: m[1], ma: m[2] || '', tipo: m[3], mb: m[4] || '', b: m[5] };
        clase(r.a); clase(r.b);
        const k = r.tipo === '..>' ? r.a + '..>' + r.b : r.a + '>' + r.b + rol(r.mb);
        if (!relaciones.has(k)) relaciones.set(k, r);
      }
    });
  });

  // Una dependencia sobra si ya existe una asociación entre las mismas clases
  const asociadas = new Set([...relaciones.values()].filter(r => r.tipo !== '..>').map(r => r.a + '>' + r.b));
  const rels = [...relaciones.values()].filter(r => r.tipo !== '..>' || !asociadas.has(r.a + '>' + r.b));

  const capaDe = (n, c) => n.startsWith('Controlador') ? 'Controladores'
    : c.estereotipo === 'Service' ? (window.VARIANTE ? 'Servicios' : 'Adaptadores') // sin capa de servicios, «Service» son los sistemas externos
    : c.estereotipo === 'Repository' ? 'DAO'
    : c.estereotipo === 'Adapter' ? 'Adaptadores' : 'Dominio';
  const capas = { Controladores: [], Servicios: [], DAO: [], Adaptadores: [], Dominio: [] };
  clases.forEach((c, n) => capas[capaDe(n, c)].push(n));

  const pintarClase = (n, sangria) => {
    const c = clases.get(n);
    const cuerpo = [...(c.estereotipo ? ['<<' + c.estereotipo + '>>'] : []), ...c.atributos.values(), ...c.metodos.values()];
    if (!cuerpo.length) return [sangria + 'class ' + n];
    return [sangria + 'class ' + n + ' {', ...cuerpo.map(x => sangria + '  ' + x), sangria + '}'];
  };
  const pintarRel = r => r.a + (r.ma ? ' "' + r.ma + '"' : '') + ' ' + r.tipo + (r.mb ? ' "' + r.mb + '"' : '') + ' ' + r.b;

  const dominio = new Set(capas.Dominio);
  const dcdDominio = ['classDiagram',
    ...capas.Dominio.flatMap(n => pintarClase(n, '')),
    ...rels.filter(r => dominio.has(r.a) && dominio.has(r.b)).map(pintarRel)].join('\n');

  // De izquierda a derecha quedan las capas en columnas: controladores, servicios, DAO y dominio
  const dcdCompleto = ['classDiagram', 'direction LR',
    ...Object.keys(capas).flatMap(k => capas[k].flatMap(n => pintarClase(n, ''))),
    ...rels.map(pintarRel)].join('\n');

  const n = k => capas[k].length;
  window.CU.push({
    id: 'DCD', nombre: 'Diagrama de clases unificado', unificado: true,
    meta: clases.size + ' clases · ' + rels.length + ' relaciones · une los DCD de ' + window.CU.length + ' casos de uso',
    supuestos: [
      'Se generó uniendo los DCD de todos los casos de uso: cada clase aparece una sola vez con la suma de los atributos y métodos que usa algún DSD.',
      'Capas: ' + n('Controladores') + ' controladores, ' + (n('Servicios') ? n('Servicios') + ' servicios, ' : '') + n('DAO') + ' DAO, ' +
        n('Adaptadores') + ' adaptadores de sistemas externos y ' + n('Dominio') + ' clases de dominio.',
      'Si dos casos de uso declaran la misma asociación (mismas clases y mismo rol) se conserva una sola. Una dependencia se omite cuando ya existe una asociación entre esas clases.',
      'El diagrama completo es muy grande y se lee por columnas (controladores a la izquierda, dominio a la derecha): conviene descargarlo en SVG y hacer zoom. El del dominio es el que resume el modelo.'
    ],
    bloques: [
      { titulo: 'DCD unificado · Dominio', code: dcdDominio, file: 'DCD_unificado_dominio' },
      { titulo: 'DCD unificado · Completo (controladores, servicios, DAO, adaptadores y dominio)', code: dcdCompleto, file: 'DCD_unificado_completo' }
    ]
  });
};

</script>
<script>
// Variante MVC + capa de servicios: el controlador solo recibe el evento de la UI y delega en un
// «Service» por caso de uso, que coordina DAO y dominio y conserva los objetos de la conversación.
(function () {
  const primitivos = new Set(['String', 'Integer', 'Real', 'Boolean', 'Date']);

  function dsdConServicio(code, servicio) {
    const lines = code.trim().replace(/«Service»/g, '«Adapter»').split('\n');
    let ultimoRetorno = -1, primero = true;
    lines.forEach((l, i) => { if (/^\s*C-->>-UI:/.test(l)) ultimoRetorno = i; });
    const out = [];
    lines.forEach((l, i) => {
      if (/^participant C as /.test(l)) {
        out.push(l, 'participant SV as sv:«Service» ' + servicio);
      } else if (primero && /^\s*UI->>\+C: /.test(l)) {
        primero = false;
        out.push(l, l.replace('UI->>+C:', 'C->>+SV:'));
      } else if (i === ultimoRetorno) {
        out.push(l.replace('C-->>-UI:', 'SV-->>-C:'), l);
      } else {
        out.push(l.replace(/^(\s*)C(-{1,2}>>)/, '$1SV$2')
                  .replace(/(>>[+-]?)C:/, '$1SV:')
                  .replace(/^(\s*Note over )C(,|:)/, '$1SV$2'));
      }
    });
    return out.join('\n');
  }

  function dcdConServicio(code, controlador, servicio) {
    const L = code.trim().replace(/<<Service>>/g, '<<Adapter>>').split('\n');
    const ini = L.findIndex(l => l.trim() === 'class ' + controlador + ' {');
    const fin = L.indexOf('}', ini);
    const cuerpo = L.slice(ini + 1, fin);
    const atributos = cuerpo.filter(l => /^\s*-/.test(l));
    const metodos = cuerpo.filter(l => /^\s*\+/.test(l));
    // Las asociaciones y dependencias del controlador (DAO, adaptadores, objetos de la conversación) pasan al servicio
    const resto = L.slice(fin + 1).map(l => l.startsWith(controlador + ' ') ? servicio + l.slice(controlador.length) : l);
    const retornos = [...new Set(metodos.map(m => (m.match(/\)\s*([A-Za-z]+)(\[\*\])?\s*$/) || [])[1])
      .filter(t => t && !primitivos.has(t)))];
    return [
      'classDiagram',
      'class ' + controlador + ' {', ...metodos, '}',
      'class ' + servicio + ' {', '  <<Service>>', ...atributos, ...metodos, '}',
      ...L.slice(1, ini),
      ...resto,
      controlador + ' "1" --> "1 -servicio" ' + servicio,
      ...retornos.map(t => controlador + ' ..> ' + t)
    ].join('\n');
  }

  window.CU.forEach(cu => {
    const servicio = cu.controlador.replace(/^Controlador/, 'Servicio');
    cu.servicio = servicio;
    cu.dsd.forEach(d => { d.code = dsdConServicio(d.code, servicio); });
    cu.dcd = dcdConServicio(cu.dcd, cu.controlador, servicio);
    cu.supuestos = [
      'Capa de servicios: ' + cu.controlador + ' solo recibe el evento de la UI y delega en ' + servicio +
      ' («Service»), que contiene la lógica del caso de uso: coordina los DAO y los objetos de dominio y decide el resultado. ' +
      'El servicio tiene alcance de sesión, por eso conserva los objetos de la conversación entre eventos.',
      ...cu.supuestos.map(s => s
        .replace(/«Service»/g, '«Adapter»')
        .replace(/del controlador/g, 'del servicio')
        .replace(/el controlador/g, 'el servicio')
        .replace(/El controlador/g, 'El servicio')
        .replace(/desde la Clase Controladora/g, 'desde el servicio'))
    ];
  });
  window.VARIANTE = 'MVC + capa de servicios';
})();

</script>

<script>
mermaid.initialize({
  startOnLoad:false, theme:'base', securityLevel:'loose', maxTextSize:900000, maxEdges:3000,
  // Rótulos como <text> SVG y no como HTML en <foreignObject>, que otros programas (p. ej. Prism) no importan
  htmlLabels:false,
  themeVariables:{ primaryColor:'#ffffff', primaryBorderColor:'#34443b', primaryTextColor:'#1d2a24', lineColor:'#34443b',
    noteBkgColor:'#fff8d6', noteBorderColor:'#b9a64a', actorBkg:'#ffffff', actorBorder:'#34443b',
    activationBkgColor:'#ffffff', activationBorderColor:'#34443b', labelBoxBkgColor:'#e6f0ea', labelBoxBorderColor:'#34443b',
    fontFamily:'Segoe UI, Arial, sans-serif', fontSize:'13px' },
  sequence:{ mirrorActors:false, useMaxWidth:false, messageMargin:30, noteMargin:8, boxMargin:8, actorMargin:30, width:130 },
  class:{ useMaxWidth:false, htmlLabels:false }
});

if (window.unificar) window.unificar();
const menu = document.getElementById('menu'), main = document.getElementById('main');
let n = 0;
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

// Parte en varias líneas los textos largos de mensajes y notas para que el DSD no se ensanche
function wrap(text, max) {
  const out = []; let line = '';
  text.split(' ').forEach(w => {
    if (line && (line + ' ' + w).length > max) { out.push(line); line = w; } else { line = line ? line + ' ' + w : w; }
  });
  out.push(line);
  return out.join('<br/>');
}
function prep(code) {
  code = code.trim();
  if (!code.startsWith('sequenceDiagram')) return code.replace(/\{(@[^}\n]*)\}/g, '⟦$1⟧');
  return code.split('\n').map(l => {
    // Estereotipo arriba y nombre abajo en la línea de vida, como en los apuntes
    if (/^\s*(create )?participant /.test(l)) return l.replace(/(«[^»]+») ?/, '$1<br/>');
    const m = l.match(/^(\s*(?:Note [^:]+|\S+?-{1,2}>>[+-]?\S+): )(.+)$/);
    return m ? m[1] + wrap(m[2], 40) : l;
  }).join('\n');
}

function block(title, code, name) {
  const sec = document.createElement('section');
  sec.innerHTML = '<h3>' + esc(title) + '</h3><div class="diagram">Dibujando…</div>' +
    '<div class="tools"><button data-a="fit">Ajustar al ancho</button><button data-a="svg">Descargar SVG</button><button data-a="copy">Copiar código Mermaid</button></div>' +
    '<details><summary>Ver código Mermaid</summary><pre>' + esc(code.trim()) + '</pre></details>';
  const box = sec.querySelector('.diagram');
  // Mermaid no admite llaves dentro de una clase: se sustituyen para dibujar y se restauran en el SVG
  const src = prep(code);
  mermaid.render('g' + (++n), src).then(r => { box.innerHTML = r.svg.replace(/⟦/g, '{').replace(/⟧/g, '}'); })
    .catch(e => {
      box.innerHTML = '<div class="err">' + esc(String(e.message || e)) + '</div>';
      document.querySelectorAll('body > [id^="dg"]').forEach(x => x.remove());
    });
  sec.querySelector('[data-a=fit]').onclick = ev => {
    ev.target.textContent = box.classList.toggle('fit') ? 'Tamaño real' : 'Ajustar al ancho';
  };
  sec.querySelector('[data-a=svg]').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([box.innerHTML], {type:'image/svg+xml'}));
    a.download = name + '.svg'; a.click();
  };
  sec.querySelector('[data-a=copy]').onclick = ev => {
    navigator.clipboard.writeText(code.trim()); ev.target.textContent = 'Copiado';
  };
  return sec;
}

function show(i) {
  const cu = window.CU[i];
  [...menu.children].forEach((b, k) => b.classList.toggle('on', k === i));
  main.innerHTML = '<h2>' + esc(cu.unificado ? cu.nombre : cu.id + ' – ' + cu.nombre) + '</h2><p class="meta">' +
    (cu.unificado ? esc(cu.meta) : 'Controlador: ' + esc(cu.controlador) + (cu.servicio ? ' · Servicio: ' + esc(cu.servicio) : '')) + '</p>';
  if (cu.supuestos && cu.supuestos.length) {
    const s = document.createElement('section');
    s.innerHTML = '<h3>Decisiones de diseño y supuestos</h3><ul>' + cu.supuestos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
    main.appendChild(s);
  }
  if (cu.bloques) {
    cu.bloques.forEach(b => main.appendChild(block(b.titulo, b.code, b.file)));
  } else {
    cu.dsd.forEach((d, k) => main.appendChild(block('DSD · ' + d.titulo, d.code, cu.id + '_DSD_evento' + (k + 1))));
    main.appendChild(block('DCD · ' + cu.id, cu.dcd, cu.id + '_DCD'));
  }
  location.hash = cu.id; window.scrollTo(0, 0);
}

window.CU.forEach((cu, i) => {
  const b = document.createElement('button');
  b.innerHTML = '<b>' + cu.id + '</b>' + esc(cu.nombre);
  b.onclick = () => show(i);
  menu.appendChild(b);
});
if (window.VARIANTE) document.querySelector('nav p').textContent += ' Arquitectura: ' + window.VARIANTE + '.';
const start = window.CU.findIndex(c => '#' + c.id === location.hash);
if (window.CU.length) show(start < 0 ? 0 : start);
</script>
